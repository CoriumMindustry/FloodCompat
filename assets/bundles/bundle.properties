#settings
fc-category = FloodCompat
setting.fc-draw.name = Custom Flood Rendering
setting.fc-draw.description = Use custom colors and effects for flood rendering instead of default walls.
setting.fc-quality.name = Quality Preset
setting.fc-quality.description = Adjusts graphical fidelity.\
  \nHigh Performance enables custom rendering and disables effects.\
  \nHigh Quality is recommended for the best experience.
setting.fc-editor.name = Color Editor
setting.fc-editor.description = Enable the in-game flood color palette editor.
setting.fc-sliders.name = Use Sliders
setting.fc-sliders.description = Use sliders instead of text fields in the color editor.
setting.fc-culling.name = Effect & Sound Culling
setting.fc-culling.description = Optimizes how the server sends sounds and effects to the client.\
  \nLocked to 40 tiles in High Performance mode.\
  \nRequires a rejoin to apply changes.
setting.fc-array.name = Shared Cache Size
setting.fc-array.description = The number of chat-shared palettes to keep in memory.\
  \nRequires a restart to apply changes.
setting.fc-customs.name = Custom Nullification Sound
setting.fc-customs.description = Allows replacing wind3 with a custom sound, played when an emitter is nullified.

